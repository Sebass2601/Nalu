# Production stack for the Hetzner server. Lives at /opt/nalu/compose.yml
# together with .env and Caddyfile. The GitHub Actions workflow pulls a new
# app image and restarts; db and caddy stay up across deploys.
services:
  db:
    image: postgres:17.0
    restart: unless-stopped
    # TLS material and pg_hba.conf live in /opt/nalu/pgtls on the server
    # (generated by hand, like .env — see "Direct database access" in
    # README.md). pg_hba rejects any non-TLS connection from outside the
    # compose network.
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgres-tls/server.crt
      - -c
      - ssl_key_file=/etc/postgres-tls/server.key
      - -c
      - hba_file=/etc/postgres-tls/pg_hba.conf
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      # Loopback publish for the deploy workflow's SSH-tunnelled migrations.
      - "127.0.0.1:5432:5432"
      # Public, Supabase-style direct access: TLS-only (enforced by pg_hba),
      # scram auth, dedicated roles. Clients verify the server with
      # certs/nalu-prod-ca.crt from the repo.
      - "6543:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pgtls:/etc/postgres-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${APP_IMAGE:-ghcr.io/sebass2601/nalu:latest}
    restart: unless-stopped
    # app.env holds the third-party credentials (Google, Stripe, UploadThing,
    # Arcjet, R2). It is written by the deploy workflow from the NALU_APP_ENV
    # repository secret, so whoever owns those credentials manages them in
    # GitHub without needing SSH access to this server. Later files win, so
    # app.env overrides the placeholders in .env.
    env_file:
      - .env
      - app.env
    environment:
      # Inside the compose network the database is the `db` service, whatever
      # the tunnel-facing values in .env say.
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      # Resized images, kept out of the container so they survive it. A deploy
      # replaces the app container, and without somewhere durable to live the
      # whole cache is thrown away every push — the first reader of every
      # lesson after every deploy pays the full download-and-re-encode again.
      #
      # Deliberately the `images` directory and not the whole of `.next/cache`.
      # The prerender and fetch caches beside it are keyed to the build that
      # wrote them, and carrying those across a deploy is how a code change
      # ships and then serves the previous version's pages. Resized images have
      # no such tie: they are keyed by source URL, width and quality, and
      # expire on their own.
      - image_cache:/app/.next/cache/images
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  image_cache:
  caddy_data:
  caddy_config:
