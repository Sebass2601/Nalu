# Deploys to the Hetzner server on every push to main. Vercel deploys the
# same push independently through its Git integration; the two share nothing
# but the commit — the Hetzner stack has its own Postgres.
#
# Required repository secrets:
#   NALU_SSH_KEY        private key whose public half is on the server
#   NALU_SSH_HOST       server IP or hostname
#   NALU_DB_PASSWORD    password of the server's Postgres (matches /opt/nalu/.env)
#   NALU_APP_ENV        third-party credentials, written to /opt/nalu/app.env
#
# --- Why the database comes before the build ---------------------------------
# `next build` with cacheComponents PRERENDERS the pages that read the database,
# and whatever those queries return at build time is baked into the image and
# served until the cache entries revalidate. Building against a throwaway
# Postgres therefore shipped a catalogue that was empty for the first ~15
# minutes after every deploy — the pages had been rendered against a database
# with no courses in it.
#
# So the build now talks to the real production database through the SSH tunnel
# this workflow already opens, which is what Vercel effectively does on its side
# (its build reads Supabase). Migrations run first, because the new code is
# prerendered against the schema it expects.
#
# Consequence worth knowing: if the build fails, production has already been
# migrated while still running the previous image. Additive migrations are
# harmless in that state; a destructive one would not be.
name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NALU_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host nalu
            HostName ${{ secrets.NALU_SSH_HOST }}
            User deploy
            StrictHostKeyChecking accept-new
          EOF

      - name: Open tunnel to the production database
        run: |
          # The db service must be up before anything reaches it — on a fresh
          # server nothing is running until the first deploy.
          ssh nalu "cd /opt/nalu && docker compose up -d --wait db"
          # ExitOnForwardFailure turns a port that fails to bind into a failed
          # step, rather than a tunnel that silently is not there and a build
          # that mysteriously cannot reach Postgres.
          ssh -f -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
            -L 15432:127.0.0.1:5432 nalu
          # The forward is established asynchronously, so wait for it rather
          # than racing the next step.
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15432) >/dev/null 2>&1 && break
            sleep 1
          done
          (echo > /dev/tcp/127.0.0.1/15432) 2>/dev/null \
            || { echo "tunnel to production Postgres never came up"; exit 1; }

      # Points at the tunnel, so migrations, seed and the build's prerendering
      # all read the same production database.
      #
      # The third-party values stay format-valid placeholders: they only have to
      # satisfy the env schema at build time. Nothing here is baked into the
      # bundle — the app reads process.env at runtime (experimental__runtimeEnv),
      # so /opt/nalu/.env and app.env are what production actually uses.
      - name: Write build env
        env:
          DB_PASSWORD: ${{ secrets.NALU_DB_PASSWORD }}
        run: |
          cat > .env <<'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=15432
          DB_USER=nalu
          DB_NAME=nalu
          DB_SSL=false
          AUTH_SECRET=build-time-placeholder-secret
          AUTH_GOOGLE_ID=placeholder
          AUTH_GOOGLE_SECRET=placeholder
          UPLOADTHING_TOKEN=placeholder
          HOTMART_SERVER=production
          HOTMART_CLIENT_ID=placeholder
          HOTMART_CLIENT_SECRET=placeholder
          HOTMART_BASIC_TOKEN=placeholder
          HOTMART_HOTTOK=placeholder
          SUBSCRIPTIONS_ENABLED=false
          SERVER_URL=https://naluescuela.com
          R2_ACCOUNT_ID=0123456789abcdef0123456789abcdef
          R2_ACCESS_KEY_ID=0123456789abcdef0123456789abcdef
          R2_SECRET_ACCESS_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          R2_BUCKET_NAME=placeholder
          EOF
          # Appended separately so the heredoc can stay quoted and leave every
          # other value untouched by the shell.
          printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" >> .env

      - name: Migrate and seed the production database
        # Both read .env, which now points at the tunnel. Seed is idempotent
        # baseline data (PPP country tiers) — running it every deploy
        # guarantees a fresh database is never left empty.
        run: |
          pnpm db:migrate
          pnpm db:seed

      # Prerenders against the production database, so the shipped pages show
      # the real catalogue instead of an empty one.
      - run: pnpm build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/nalu
          IMAGE=${IMAGE,,}
          docker build -f deploy/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Sync app credentials
        # NALU_APP_ENV holds the third-party credential lines
        # (AUTH_GOOGLE_*, HOTMART_*, UPLOADTHING_TOKEN, ARCJET_KEY, R2_*) as a
        # plain env file. Whoever owns those credentials edits the secret in
        # GitHub; each deploy rewrites /opt/nalu/app.env from it. When the
        # secret is unset, an existing app.env is left alone.
        env:
          APP_ENV: ${{ secrets.NALU_APP_ENV }}
        run: |
          ssh nalu "touch /opt/nalu/app.env && chmod 600 /opt/nalu/app.env"
          if [ -n "$APP_ENV" ]; then
            printf '%s\n' "$APP_ENV" | ssh nalu "cat > /opt/nalu/app.env"
          fi

      - name: Deploy
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/nalu
          IMAGE=${IMAGE,,}
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh nalu "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh nalu "cd /opt/nalu && \
            APP_IMAGE=$IMAGE:${{ github.sha }} docker compose pull app -q && \
            sed -i 's|^APP_IMAGE=.*|APP_IMAGE=$IMAGE:${{ github.sha }}|' .env && \
            docker compose up -d --remove-orphans && \
            docker image prune -f"

      - name: Smoke test
        # /favicon.ico rather than /, because proxy.ts excludes it from the
        # matcher and Arcjet therefore never sees it. Arcjet's bot rule is an
        # allow-list, so it answers any curl on a normal route with 403 and
        # `curl -sf` turns that into a failed step on a perfectly good deploy.
        run: |
          sleep 5
          ssh nalu "curl -sf -o /dev/null -w '%{http_code}\n' http://localhost:80/favicon.ico -H \"Host: \$(grep ^DOMAIN= /opt/nalu/.env | cut -d= -f2)\""
